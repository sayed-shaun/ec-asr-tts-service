services:
  litserver:
    build:
      context: .
      dockerfile: litserver.Dockerfile
    env_file:
      - .env
    environment:
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    networks:
      - speech-net
    volumes:
      - hf-cache:/opt/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 3600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    build:
      context: .
      dockerfile: fastapi.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8000}:${GATEWAY_PORT:-8000}"
    env_file:
      - .env
    networks:
      - speech-net
    depends_on:
      litserver:
        condition: service_healthy

networks:
  speech-net:

volumes:
  hf-cache:
