services:
  asr:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hf-cache:/opt/cache/huggingface
    # Requires nvidia-container-toolkit on the host — needed because
    # ASR_ACCELERATOR defaults to "cuda". For a CPU-only host, remove this
    # block and set ASR_ACCELERATOR=cpu in .env.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
