services:
  litserver:
    build:
      context: .
      dockerfile: litserver.Dockerfile
      args:
        SHERPA_ONNX_CUDA_VERSION: "${SHERPA_ONNX_CUDA_VERSION:-}"
    env_file:
      - .env
    environment:
      # Reduces CUDA allocator fragmentation from repeated variable-length
      # batches (the exact scenario ASR inference produces) -- suggested
      # directly by PyTorch's own OOM error message.
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    networks:
      - asr-net
    volumes:
      - hf-cache:/opt/cache/huggingface
    healthcheck:
      # LitServe answers /health with 503 until every worker finishes setup(),
      # and a cold start downloads the checkpoints into the hf-cache volume --
      # ~2.6GB for TTS alone, so first boot can run tens of minutes on a slow
      # link while later boots take seconds. start_period is the knob that
      # covers it: failures inside it never count toward retries and never mark
      # the container unhealthy, but the first success promotes it immediately,
      # so a generous value costs nothing on a warm cache. The gateway waits on
      # service_healthy below, so this is also what stops compose giving up on
      # the gateway mid-download. A litserver that dies outright still fails
      # fast -- compose reports the exit, it doesn't wait this out.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 3600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    build:
      context: .
      dockerfile: fastapi.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8000}:${GATEWAY_PORT:-8000}"
    env_file:
      - .env
    networks:
      - asr-net
    depends_on:
      litserver:
        condition: service_healthy

networks:
  asr-net:

volumes:
  hf-cache:
