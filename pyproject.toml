[project]
name = "ec-asr-tts-service"
version = "0.1.0"
description = "Bengali speech-to-text service"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
serve = [
    "torch>=2.0.0",
    "litserve>=0.2.9",
    "librosa>=0.10.0,<1.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "sherpa-onnx>=1.10.0",
    "huggingface-hub>=0.23.0",
    "parler-tts @ git+https://github.com/huggingface/parler-tts.git",
]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
    "ruff>=0.8.4",
]
triton = [
    "onnx>=1.15.0",
]
eval = [
    "datasets>=2.19.0",
    "jiwer>=3.0.0",
    "tqdm>=4.66.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:aifc was removed in Python 3.13:DeprecationWarning",
    "ignore:sunau was removed in Python 3.13:DeprecationWarning",
    "ignore:PySoundFile failed. Trying audioread instead.:UserWarning",
    "ignore:librosa.core.audio.__audioread_load:FutureWarning",
]
