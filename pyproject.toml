[project]
name = "bangla-asr-pipeline"
version = "0.1.0"
description = "Bengali speech-to-text service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
serve = [
    "torch>=2.1.0",
    "nemo_toolkit[asr]>=2.0.0",
    "litserve>=0.2.9",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx2>=2.9.1",
    "pre-commit>=3.7.0",
    "ruff>=0.8.4",
]
triton = [
    "onnx>=1.15.0",
]
denoise = [
    "noisereduce>=3.0.0",
]
speaker = [
    "resemblyzer>=0.1.4",
]
eval = [
    "pyarrow>=14.0.0",
    "jiwer>=3.0.0",
    "tqdm>=4.66.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 82
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
filterwarnings = [
    # librosa -> audioread's pure-Python fallback decoder imports these unconditionally;
    # removed from the stdlib in Python 3.13, audioread falls back to the standard-aifc/
    # standard-sunau backport packages, which warn on every import. Nothing on our side
    # to fix — nothing in this repo touches aifc/sunau directly.
    "ignore:aifc was removed in Python 3.13:DeprecationWarning",
    "ignore:sunau was removed in Python 3.13:DeprecationWarning",
    # Expected for any compressed format (webm/opus, mp4, mp3, ...) — soundfile/
    # libsndfile only reads a handful of container formats, so decode_base64_audio's
    # audioread/ffmpeg fallback is the intended path for anything else, not a bug.
    "ignore:PySoundFile failed. Trying audioread instead.:UserWarning",
    "ignore:librosa.core.audio.__audioread_load:FutureWarning",
]
